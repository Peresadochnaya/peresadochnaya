apiVersion: batch/v1
kind: CronJob
metadata:
  name: rail-refresh
  namespace: peresadochnaya
spec:
  schedule: '0 3 * * *'
  # A rolling week needs many Rasp API calls: enable only after assigning a key/budget.
  suspend: true
  timeZone: Europe/Moscow
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: {app: peresadochnaya-rail-refresh}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # local-path RWO may be shared by pods on one node. Keep the updater
          # beside the API that owns the bound volume (also in multi-node k3s).
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {app: peresadochnaya-api}
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: refresh
              image: ghcr.io/peresadochnaya/peresadochnaya:REPLACE_WITH_COMMIT_SHA
              command: [python, -m, data.rail.refresh]
              args: [--store-dir, /data/rail, --raw-dir, /data/rail-raw, --days, '7']
              envFrom:
                - configMapRef: {name: backend-config}
              env:
                - name: YANDEX_RASP_API_KEY
                  valueFrom:
                    secretKeyRef: {name: yandex-rasp, key: apikey}
                - name: HTTPS_PROXY
                  valueFrom:
                    secretKeyRef:
                      name: gtfs-proxy
                      key: url
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: '1', memory: 1Gi}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: transit-data}
            - name: tmp
              emptyDir: {}
