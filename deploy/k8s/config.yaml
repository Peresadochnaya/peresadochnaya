apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: peresadochnaya
data:
  DATA_ROOT: /data
  GTFS_INDEX_DIR: /data/gtfs-index
  GTFS_PRELOAD: "true"
  REALTIME_URL: http://realtime:8001
  PLANNER_MODE: otp
  OTP_URL: http://otp:8080
  OTP_TIMEOUT_SECONDS: "30"
  TZ: Europe/Moscow
