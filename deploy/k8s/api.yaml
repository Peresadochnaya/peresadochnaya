apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: peresadochnaya
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: peresadochnaya-api}
  template:
    metadata:
      labels: {app: peresadochnaya-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: ghcr.io/peresadochnaya/peresadochnaya:REPLACE_WITH_COMMIT_SHA
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: backend-config}
          env:
            - name: YANDEX_GEOCODER_API_KEY
              valueFrom:
                secretKeyRef: {name: yandex-api, key: geocoder, optional: true}
            - name: YANDEX_SUGGEST_API_KEY
              valueFrom:
                secretKeyRef: {name: yandex-api, key: suggest, optional: true}
            - name: YANDEX_ROUTER_API_KEY
              valueFrom:
                secretKeyRef: {name: yandex-api, key: router, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: transit-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: peresadochnaya
spec:
  selector: {app: peresadochnaya-api}
  ports:
    - {name: http, port: 80, targetPort: http}
