          anyOf:
          - type: string
          - type: 'null'
          title: Duplicate Of Route Id
        original_rank:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Original Rank
        reason_code:
          type: string
          enum:
          - boarding_unreachable
          - tail_replanning_failed
          - invalid_timeline
          - duplicate_after_replanning
          - unknown
          title: Reason Code
        reason:
          type: string
          title: Reason
        original_route:
          $ref: '#/components/schemas/Route'
          description: Полный исходный вариант OTP до поправок, включая геометрию
            и legs; не является рекомендацией к поездке
        tail_replanning_status:
          anyOf:
          - type: string
            enum:
            - pending
            - failed
          - type: 'null'
          title: Tail Replanning Status
      additionalProperties: false
      type: object
      required:
      - reason_code
      - reason
      - original_route
      title: ExcludedCandidateDebug
    FareItem:
      properties:
        mode:
          type: string
          enum:
          - bus
          - tram
          - trolleybus
          - metro
          - rail
          title: Mode
        rides:
          type: integer
          minimum: 0.0
          title: Rides
          description: Number of boardings of this mode
        cost_rub:
          type: number
          minimum: 0.0
          title: Cost Rub
          description: rides × fare of this mode
      additionalProperties: false
      type: object
      required:
      - mode
      - rides
      - cost_rub
      title: FareItem
    FarePreferences:
      properties:
        rules:
          items:
            $ref: '#/components/schemas/FareRule'
          type: array
          maxItems: 5
          minItems: 1
          title: Rules
          description: One rule per transit mode; missing modes are treated as free
        transfer_cost_rub:
          type: number
          maximum: 100000.0
          minimum: 0.0
          title: Transfer Cost Rub
          description: Extra charge for every transfer between two transit legs
          default: 0
        value_of_time_rub_per_hour:
          type: number
          maximum: 100000.0
          exclusiveMinimum: 0.0
          title: Value Of Time Rub Per Hour
          description: How many rubles one hour of travel time is worth; converts
            fares into routing cost
          default: 600
      additionalProperties: false
      type: object
      required:
      - rules
      title: FarePreferences
      description: 'Explicit tariffs for the search. They replace the ticket profile:

        the profile is only recorded, while these rules affect the itinerary.'
