openapi: 3.1.0
info:
  title: Пересадочная API
  description: 'Контракт front/back. Справочные и геосервисные ручки реализованы.
    /routes возвращает dummy-ответ; реальный поиск ещё не подключён. MVP реального
    поиска — только OTP. mode=real означает расчёт планировщика и не обещает пробки
    или realtime: их фактические источники указаны в sources.'
  version: 0.2.0
paths:
  /api/v1/stops:
    get:
      tags:
      - GTFS
      summary: Stops
      operationId: stops_api_v1_stops_get
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          title: Bbox
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
            pattern: \S
          - type: 'null'
          title: Q
      - name: modes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Modes
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsStopsResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Stops Api V1 Stops Get
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      description: Список остановок и станций в bbox. Фильтры q и modes применяются
        до пагинации; modes означает наличие обслуживающей линии указанного типа.
        Порядок stop_id стабилен в пределах снимка. Нет совпадений — items=[], total=0.
        total — число совпадений до пагинации. Данные читаются из одного локального
        снимка, идентификаторы относятся к gtfs_version. Нет загруженного снимка —
        503 gtfs_unavailable. Запрос не запускает обновление GTFS.
  /api/v1/stops/{stop_id}:
    get:
      tags:
      - GTFS
      summary: Stop
      operationId: stop_api_v1_stops__stop_id__get
      parameters:
      - name: stop_id
        in: path
        required: true
        schema:
          type: string
          title: Stop Id
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsStopResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Stop Api V1 Stops  Stop Id  Get
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      description: Название, координаты и доступные сведения из stops.txt, а также
        обслуживающие транспортные линии. Поле description соответствует stop_desc;
        почтовый адрес не выдумывается. Неизвестный stop_id — 404 stop_not_found.
        Данные читаются из одного локального снимка, идентификаторы относятся к gtfs_version.
        Нет загруженного снимка — 503 gtfs_unavailable. Запрос не запускает обновление
        GTFS.
  /api/v1/stops/{stop_id}/departures:
    get:
      tags:
      - GTFS
      summary: Departures
      operationId: departures_api_v1_stops__stop_id__departures_get
      parameters:
      - name: stop_id
        in: path
        required: true
        schema:
          type: string
          title: Stop Id
      - name: departure_at
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Departure At
      - name: lookahead_minutes
        in: query
        required: false
        schema:
          type: integer
          maximum: 1440
          minimum: 1
          default: 120
          title: Lookahead Minutes
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsDeparturesResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Departures Api V1 Stops  Stop Id  Departures Get
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      description: Отправления из локального снимка GTFS. Для точного расписания scheduled_departure_at
        содержит ISO-время с offset. Для frequencies.txt exact_times=0 возвращается
        schedule_type=frequency, scheduled_departure_at=null, headway_seconds и окно
        frequency_start_at/frequency_end_at; это интервал, не обещание конкретной
        посадки. Частотное окно пересекается с запрошенным окном; сортировка по точному
        времени либо началу пересечения. Учитываются service day, исключения calendar_dates,
        времена >=24:00:00 и часовой пояс перевозчика. Некорректный календарь — 422
        invalid_service_date. Доступ к внешним API не требуется.
  /api/v1/transit-routes:
    get:
      tags:
      - GTFS
      summary: Lines
      operationId: lines_api_v1_transit_routes_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
            pattern: \S
          - type: 'null'
          title: Q
      - name: modes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Modes
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsRoutesResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Lines Api V1 Transit Routes Get
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      description: Номера, названия и виды транспорта из routes.txt. Это линии ОТ,
        а не результаты планирования поездки A → B. Фильтры применяются до пагинации;
        сортировка по route_id. Нет совпадений — items=[], total=0. Данные читаются
        из одного локального снимка, идентификаторы относятся к gtfs_version. Нет
        загруженного снимка — 503 gtfs_unavailable. Запрос не запускает обновление
        GTFS.
  /api/v1/transit-routes/{route_id}:
    get:
      tags:
      - GTFS
      summary: Line
      operationId: line_api_v1_transit_routes__route_id__get
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          title: Route Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsRouteResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Line Api V1 Transit Routes  Route Id  Get
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      description: 'Линия, направления и страница связанных рейсов из trips.txt, независимо
        от календарной активности на текущую дату. direction_id=0/1 не означает универсально
        прямое/обратное направление: для подписи используется headsign. Направление
        может отсутствовать. trips отсортированы по trip_id; offset, limit, total,
        has_more относятся только к trips. Неизвестная линия — 404 transit_route_not_found.
        Данные читаются из одного локального снимка, идентификаторы относятся к gtfs_version.
        Нет загруженного снимка — 503 gtfs_unavailable. Запрос не запускает обновление
        GTFS.'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - GTFS
      summary: Trip
      operationId: trip_api_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsTripResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Trip Api V1 Trips  Trip Id  Get
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      description: 'Рейс с service_id, остановками по stop_sequence, временами stop_times
        и геометрией shapes.txt. Порядок времени — сервисный день GTFS: 25:10:00 означает
        01:10 следующего календарного дня. Времена возвращаются исходными строками,
        не приводятся к 00–23 и не обещают активности рейса сегодня. Время промежуточной
        остановки может отсутствовать; в таком случае null, без выдуманной интерполяции.
        Геометрия — LineString в [lon,lat], либо null с предупреждением, если shape
        отсутствует. Неизвестный trip_id — 404 trip_not_found. Данные читаются из
        одного локального снимка, идентификаторы относятся к gtfs_version. Нет загруженного
        снимка — 503 gtfs_unavailable. Запрос не запускает обновление GTFS.'
  /api/v1/vehicles:
    get:
      summary: Vehicles
      description: 'Текущие позиции транспорта из GTFS-RT VehiclePosition.

        Кэш сервера 15–30 с. Если фид молчит дольше 2× интервала — stale=true.

        Если лимит достигнут и есть ещё — warning vehicles_truncated.

        '
      operationId: vehicles_api_v1_vehicles_get
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          pattern: ^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$
          title: Bbox
      - name: modes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Modes
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclesResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health/live:
    get:
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      description: Готовность HTTP API. Доступность GTFS и графа планировщика проверяется
        отдельно через /api/v1/data/status.
  /api/v1/data/status:
    get:
      summary: Data Status
      operationId: data_status_api_v1_data_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStatus'
  /api/v1/ticket-profiles:
    get:
      summary: Ticket Profiles
      operationId: ticket_profiles_api_v1_ticket_profiles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TicketProfileInfo'
                type: array
                title: Response Ticket Profiles Api V1 Ticket Profiles Get
  /api/v1/suggest:
    get:
      summary: Suggest
      description: Address suggestions biased towards Saint Petersburg and Leningrad
        Oblast. Resolve the selected URI through the geocoder to obtain coordinates.
        Yandex is contacted only with dummy=false.
      operationId: suggest_api_v1_suggest_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 256
          pattern: \S
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10
          minimum: 1
          default: 5
          title: Limit
      - name: provider
        in: query
        required: false
        schema:
          enum:
          - yandex
          - 2gis
          type: string
          default: yandex
          title: Provider
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          description: Recorded or synthetic demo response without Yandex calls; explicitly
            pass false to enable provider access
          default: true
          title: Dummy
        description: Recorded or synthetic demo response without Yandex calls; explicitly
          pass false to enable provider access
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Suggest Api V1 Suggest Get
          description: Unprocessable Content
  /api/v1/geocode:
    get:
      summary: Geocode
      description: Resolve exactly one of q (address) or uri (selected suggestion).
        At most one result; no match yields items=[].
      operationId: geocode_api_v1_geocode_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 256
            pattern: \S
          - type: 'null'
          title: Q
      - name: uri
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
            pattern: \S
          - type: 'null'
          title: Uri
      - name: provider
        in: query
        required: false
        schema:
          enum:
          - yandex
          - 2gis
          type: string
          default: yandex
          title: Provider
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Geocode Api V1 Geocode Get
          description: Unprocessable Content
  /api/v1/reverse:
    get:
      summary: Reverse
      description: Resolve coordinates to an address. Result coordinates belong to
        the found object; keep the original clicked point for routing.
      operationId: reverse_api_v1_reverse_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: Lon
      - name: provider
        in: query
        required: false
        schema:
          enum:
          - yandex
          - 2gis
          type: string
          default: yandex
          title: Provider
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dummy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Reverse Api V1 Reverse Get
          description: Unprocessable Content
  /api/v1/road-route:
    post:
      summary: Road Route
      description: Driving estimate for exactly two ordered points, independently
        of OTP. One traffic mode per call, at most one Yandex request with dummy=false.
        Not a public transport route. No automatic traffic comparison.
      operationId: road_route_api_v1_road_route_post
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          enum:
          - yandex
          - 2gis
          type: string
          default: yandex
          title: Provider
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          description: Recorded or synthetic driving sample; explicitly pass false
            to spend one Router API request
          default: true
          title: Dummy
        description: Recorded or synthetic driving sample; explicitly pass false to
          spend one Router API request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadRouteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadRouteResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Road Route Api V1 Road Route Post
          description: Unprocessable Content
  /api/v1/routes:
    post:
      summary: Routes
      operationId: routes_api_v1_routes_post
      parameters:
      - name: dummy
        in: query
        required: false
        schema:
          type: boolean
          description: Synthetic response without Yandex calls; explicitly pass false
            to enable real planning and provider access
          default: true
          title: Dummy
        description: Synthetic response without Yandex calls; explicitly pass false
          to enable real planning and provider access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutesResponse'
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Routes Api V1 Routes Post
          description: Unprocessable Content
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
      description: 'Контракт поиска поездки A → B. В MVP используется только OTP:
        providers=[otp], без Яндекс/2ГИС-поправок и без GTFS-RT. Реальный поиск пока
        не подключён: dummy=false возвращает 503 planner_unavailable. providers —
        массив источников кандидатов, отдельный от режима dummy. Позднее варианты
        OTP, Яндекса и 2ГИС объединяются и переранжируются; provenance в каждом варианте
        сохраняет происхождение кандидата и фактически применённые поправки. modes
        — массив видов транспорта; walk_speed=slow|normal|fast и less_walking — предпочтения
        для OTP. passenger задаёт один из пяти профилей и uncovered_payment для поездок
        вне покрытия проездного. Сейчас backend принимает эти поля только как контракт,
        возвращает явно синтетический ответ либо 503 planner_unavailable и не применяет
        предпочтения к реальным маршрутам. Для метро доступны справочные интервалы,
        режимы работы, топология и переходы из data/processed/metro. Половина модельного
        интервала допускается как явно помеченная эвристика ожидания с metro_wait_estimate,
        но не как точное расписание. Начало/конец работы проверяются по направлению
        и станции. Праздничные дни и изменённый режим требуют отдельного календаря.
        Отдельный оценочный GTFS метро собирается data.metro.refresh: времена перегонов
        и переходов берутся из pMetro и имеют duration_source=estimated. Это справочные
        оценки, а не официальное расписание. Исходные CSV связей остаются без длительностей;
        обогащённые таблицы и происхождение данных лежат в metro_reference.json внутри
        GTFS ZIP.'
