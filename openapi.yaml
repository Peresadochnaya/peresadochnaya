          - type: 'null'
          title: Gtfs Version
        graph_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Graph Version
        graph:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Graph
        graph_check:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Graph Check
        last_check:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Last Check
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Manifest
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - state
      title: DataStatus
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    ExcludedCandidateDebug:
