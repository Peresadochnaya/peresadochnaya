              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Gateway Timeout
      description: 'dummy=true возвращает согласованный демонстрационный маршрут по
        общей сети GTFS линии 193: пеший подход, ожидание по синтетическому расписанию
        раз в 10 минут, автобус и пеший участок до назначения. Если подходящего участка
        этой небольшой сети нет или автобус исключён, возвращается пеший пример. Это
        не реальный планировщик и не обещание оптимальности. В демо учитываются modes,
        exclude_modes и walk_speed; стоимость проездного не рассчитывается. Время
        начала округляется вверх до секунды. Идентификаторы линии, рейса и остановок
        совпадают со справочными ручками; времена автобуса совпадают с демо-отправлениями.
        dummy=false при PLANNER_MODE=otp вызывает OTP; без настройки возвращает 503
        planner_unavailable. Реальный MVP — только providers=[otp]; modes и exclude_modes,
        max_transfers, walk_speed и less_walking передаются в OTP. modes=null сохраняет
        все виды транспорта; modes=[walk] запрашивает только пеший маршрут без автомобильных
        запросов даже при traffic_mode=on. Отдельный пеший вариант участвует наравне
        с транспортом; при пустом результате выполняется отдельный пеший поиск. Пустой
        результат OTP сохраняется с предупреждениями: недостижимость и лимиты поиска
        не заменяются прямой линией. traffic_mode=on включает дорожную оценку в общем
        бюджете 15 секунд: до одного автомобильного A/B расчёта 2ГИС с альтернативами
        и до одного Яндекс-запроса с максимум 50 точками, без платных повторов. Кэш
        свеж 1800 секунд. Положительные поправки применяются к сопоставленным межостановочным
        частям; метро, железная дорога и подтверждённые выделенные пути не корректируются.
        После задержки интервального транспорта хвост перепланируется от остановки
        высадки; недостижимые невосстановленные посадки исключаются. Достаточное покрытие
        >=80% получает приоритет перед неполным; max_results общий, включая пешие
        маршруты. Если после восстановления хвоста варианты получили полностью одинаковые
        итоговые участки, возвращается один с диагностикой объединённых исходных вариантов;
        разные рейсы, времена и геометрии сохраняются. Полный debug всегда содержит
        диагностику, включая исключённые исходные варианты. Обычный поиск OTP использует
        GTFS-RT; дорожная коррекция берёт исходное расписание без realtime-поправок,
        чтобы не учитывать задержку повторно. Фактические источники отмечены в provenance
        и sources. Оценочный GTFS метро отдельно собирается data.metro.refresh из
        официальной сети, интервалов и справочных времён pMetro; точное расписание
        поездов неизвестно. Ожидание метро может описываться metro_wait_estimate с
        duration_source=estimated. В метро-демо эти данные пока не используются.'
components:
  schemas:
    DataStatus:
      properties:
        state:
          type: string
