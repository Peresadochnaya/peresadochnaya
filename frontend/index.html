<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маршруты на MapLibre</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.17.0/dist/maplibre-gl.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  #map { position: absolute; inset: 0; }

  /* ===== Курсор-флажок в режиме выбора точки ===== */
  #map.selecting .maplibregl-canvas,
  #map.selecting .maplibregl-canvas-container {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='40' viewBox='0 0 32 40'><line x1='8' y1='4' x2='8' y2='36' stroke='%23374151' stroke-width='2.5' stroke-linecap='round'/><path d='M8 4 L26 9 L8 16 Z' fill='%23ef4444'/></svg>") 8 36, crosshair !important;
  }

  /* ===== Панель ===== */
  #panel {
    position: absolute;
    top: 20px; left: 20px;
    width: 340px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    padding: 16px;
    z-index: 10;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  #panel h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; color: #111827; }
  #panel h3 {
    margin: 16px 0 8px; font-size: 12px; color: #6b7280;
    font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
  }

  .input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

  .dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; flex-shrink: 0; font-size: 13px;
  }
  .dot-a { background: #10b981; }
  .dot-b { background: #ef4444; }

  .input-row input {
    flex: 1; min-width: 0;
    padding: 9px 10px;
    border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 14px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-row input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  .clear-btn {
    background: none; border: none; cursor: pointer;
    color: #9ca3af; font-size: 18px;
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .clear-btn:hover { background: #f3f4f6; color: #374151; }

  #hint {
    font-size: 12px; color: #4b5563;
    margin: 4px 0 8px;
    padding: 8px 10px;
    background: #f3f4f6;
    border-radius: 8px;
    line-height: 1.4;
  }

  #routes { overflow-y: auto; flex: 1; min-height: 0; }

  .route-item {
    padding: 10px 12px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .route-item:hover { border-color: #93c5fd; }
  .route-item.active { border-color: #3b82f6; background: #eff6ff; }
  .route-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #111827; }
  .route-meta { display: flex; gap: 14px; font-size: 13px; color: #6b7280; }
  .route-meta .primary { color: #111827; font-weight: 600; }

  .placeholder { font-size: 13px; color: #9ca3af; padding: 4px 0; }

  .reset-btn {
    margin-top: 10px; padding: 9px 12px;
    background: #f3f4f6; border: none;
    border-radius: 8px; cursor: pointer;
    font-size: 13px; color: #374151; font-weight: 500;
    width: 100%;
  }
  .reset-btn:hover { background: #e5e7eb; }

  /* ===== Маркеры-пины ===== */
  .marker-pin {
    width: 32px; height: 40px;
    position: relative;
    cursor: grab;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.35));
    user-select: none;
  }
  .marker-pin:active { cursor: grabbing; }
  .marker-pin svg { display: block; width: 100%; height: 100%; }
  .marker-pin .label {
    position: absolute;
    top: 9px; left: 0; right: 0;
    text-align: center;
    color: #fff; font-weight: 700; font-size: 13px;
    pointer-events: none;
    line-height: 1;
  }

  @media (max-width: 480px) {
    #panel { width: calc(100vw - 24px); left: 12px; top: 12px; padding: 12px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <h2>Маршрут</h2>

  <div class="input-row">
    <div class="dot dot-a">A</div>
    <input id="input-a" type="text" placeholder="Адрес точки А" autocomplete="off" />
    <button id="clear-a" class="clear-btn" title="Очистить">×</button>
  </div>
  <div class="input-row">
    <div class="dot dot-b">Б</div>
    <input id="input-b" type="text" placeholder="Адрес точки Б" autocomplete="off" />
    <button id="clear-b" class="clear-btn" title="Очистить">×</button>
  </div>

  <div id="hint">Кликните на карте, чтобы поставить точку А</div>

  <h3>Маршруты</h3>
  <div id="routes"><div class="placeholder">Маршруты появятся здесь</div></div>

  <button id="reset-btn" class="reset-btn">Сбросить</button>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.17.0/dist/maplibre-gl.mjs';

/* ============================================================
 *  ЗАГЛУШКИ БЭКЕНДА
 *  Замените тела этих функций на реальные запросы к вашему API.
 *  Контракты (формат данных) описаны в комментариях.
 * ============================================================ */

// Вспомогательная функция — имитация сетевой задержки
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/**
 * Поиск координат по строке адреса.
 * TODO: заменить на реальный запрос:
 *   const res = await fetch(`/api/geocode?q=${encodeURIComponent(query)}`);
 *   const data = await res.json();
 * Ожидаемый ответ от бэкенда: { lng: number, lat: number, label: string }
 */
async function api_geocodeAddress(query) {
  await sleep(300);
  // Заглушка: отдаём случайную точку около центра Москвы
  const baseLng = 37.6173, baseLat = 55.7558;
  return {
    lng: baseLng + (Math.random() - 0.5) * 0.15,
    lat: baseLat + (Math.random() - 0.5) * 0.10,
    label: query,
  };
}

/**
 * Обратное геокодирование: координаты → человекочитаемый адрес.
 * TODO: заменить на реальный запрос:
 *   const res = await fetch(`/api/reverse?lng=${lng}&lat=${lat}`);
 *   const data = await res.json();
 * Ожидаемый ответ: { label: string }
 */
async function api_reverseGeocode(lng, lat) {
  await sleep(200);
  return `Точка ${lng.toFixed(5)}, ${lat.toFixed(5)}`;
}

/**
 * Получение вариантов маршрута между двумя точками.
 * TODO: заменить на реальный запрос:
 *   const res = await fetch('/api/route', {
 *     method: 'POST',
 *     headers: { 'Content-Type': 'application/json' },
 *     body: JSON.stringify({ from: pointA, to: pointB }),
 *   });
 *   const data = await res.json();
 * Ожидаемый ответ — массив объектов:
 *   {
 *     id: string,
 *     name: string,
 *     distance: number,  // метры
 *     duration: number,  // секунды
 *     geometry: GeoJSON.LineString
 *   }
 */
async function api_getRoutes(pointA, pointB) {
  await sleep(500);

  const straightDist = haversine(pointA, pointB);
  const bendings = [0, -0.6, 0.6];
  const names = ['Быстрый', 'Короткий', 'Живописный'];
  const multipliers = [1.0, 1.08, 1.15];

  return names.map((name, i) => {
    const dist = Math.round(straightDist * multipliers[i]);
    return {
      id: 'route-' + i,
      name,
      distance: dist,
      duration: Math.round(dist / (12 + i * 2)), // ~43–50 км/ч
      geometry: makeCurvedLine(
        [pointA.lng, pointA.lat],
        [pointB.lng, pointB.lat],
        bendings[i]
      ),
    };
  });
}

/* ===== Утилиты для заглушки маршрутов ===== */

function haversine(a, b) {
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat / 2) ** 2
          + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180)
          * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function makeCurvedLine(start, end, bend) {
  const dx = end[0] - start[0];
  const dy = end[1] - start[1];
  const len = Math.hypot(dx, dy) || 1e-9;
  const perpX = -dy / len, perpY = dx / len;
  const ctrlX = (start[0] + end[0]) / 2 + perpX * bend * len * 0.2;
  const ctrlY = (start[1] + end[1]) / 2 + perpY * bend * len * 0.2;

  const coords = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = (1 - t) ** 2 * start[0] + 2 * (1 - t) * t * ctrlX + t ** 2 * end[0];
    const y = (1 - t) ** 2 * start[1] + 2 * (1 - t) * t * ctrlY + t ** 2 * end[1];
    coords.push([x, y]);
  }
  return { type: 'LineString', coordinates: coords };
}

/* ============================================================
 *  ИНИЦИАЛИЗАЦИЯ КАРТЫ
 * ============================================================ */

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [30.310138, 59.956433],
  zoom: 14,
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.on('error', (e) => console.error('Map error:', e.error));

const mapContainer = document.getElementById('map');
const inputA = document.getElementById('input-a');
const inputB = document.getElementById('input-b');
const hintEl = document.getElementById('hint');
const routesEl = document.getElementById('routes');

/* ============================================================
 *  СОСТОЯНИЕ ПРИЛОЖЕНИЯ
 * ============================================================ */

const state = {
  A: null,                 // { lng, lat, label } | null
  B: null,
  selecting: 'A',          // 'A' | 'B' | null
  routes: [],              // массив из api_getRoutes
  activeRouteId: null,
};

const markers = { A: null, B: null };

/* ============================================================
 *  КУРСОР И ПОДСКАЗКИ
 * ============================================================ */

const FLAG_CURSOR =
  `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='40' viewBox='0 0 32 40'><line x1='8' y1='4' x2='8' y2='36' stroke='%23374151' stroke-width='2.5' stroke-linecap='round'/><path d='M8 4 L26 9 L8 16 Z' fill='%23ef4444'/></svg>") 8 36, crosshair`;

function setSelecting(which) {
  state.selecting = which;
  const canvas = map.getCanvas();

  if (which) {
    mapContainer.classList.add('selecting');
    // Дублируем через JS, чтобы перебить возможные inline-стили MapLibre
    canvas.style.setProperty('cursor', FLAG_CURSOR, 'important');
    hintEl.textContent =
      which === 'A'
        ? 'Кликните на карте или введите адрес — точка А'
        : 'Кликните на карте или введите адрес — точка Б';
  } else {
    mapContainer.classList.remove('selecting');
    canvas.style.removeProperty('cursor');
    hintEl.textContent = 'Перетащите маркеры, чтобы изменить точки, или введите адрес';
  }
}

/* ============================================================
 *  МАРКЕРЫ
 * ============================================================ */

function createMarkerElement(which) {
  const color = which === 'A' ? '#10b981' : '#ef4444';
  const el = document.createElement('div');
  el.className = 'marker-pin';
  el.innerHTML = `
    <svg viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg" width="32" height="40">
      <path d="M16 1 C7.7 1 1 7.7 1 16 C1 27 16 39 16 39 C16 39 31 27 31 16 C31 7.7 24.3 1 16 1 Z"
            fill="${color}" stroke="#ffffff" stroke-width="2"/>
    </svg>
    <span class="label">${which}</span>
  `;
  return el;
}

function placeMarker(which, lng, lat) {
  if (markers[which]) markers[which].remove();

  const marker = new maplibregl.Marker({
    element: createMarkerElement(which),
    anchor: 'bottom',
    draggable: true,
  })
    .setLngLat([lng, lat])
    .addTo(map);

  marker.on('dragend', async () => {
    const pos = marker.getLngLat();
    await setPoint(which, pos.lng, pos.lat, null, { keepHint: true });
  });

  markers[which] = marker;
}

/* ============================================================
 *  УСТАНОВКА ТОЧКИ
 * ============================================================ */

async function setPoint(which, lng, lat, label, { keepHint = false } = {}) {
  if (label == null) {
    if (!keepHint) hintEl.textContent = 'Определяем адрес…';
    label = await api_reverseGeocode(lng, lat);
  }

  state[which] = { lng, lat, label };
  placeMarker(which, lng, lat);
  (which === 'A' ? inputA : inputB).value = label;

  // Сбрасываем старые маршруты — они больше не актуальны
  clearRoutes();

  if (state.A && state.B) {
    setSelecting(null);
    await buildRoutes();
  } else if (!keepHint) {
    setSelecting(which === 'A' ? 'B' : 'A');
  }
}

/* ============================================================
 *  МАРШРУТЫ: ПОЛУЧЕНИЕ И ОТРИСОВКА
 * ============================================================ */

async function buildRoutes() {
  routesEl.innerHTML = '<div class="placeholder">Построение маршрутов…</div>';

  try {
    const routes = await api_getRoutes(state.A, state.B);
    state.routes = routes;

    routesEl.innerHTML = '';
    if (routes.length === 0) {
      routesEl.innerHTML = '<div class="placeholder">Маршруты не найдены</div>';
      return;
    }

    routes.forEach((r) => {
      addRouteToMap(r);

      const item = document.createElement('div');
      item.className = 'route-item';
      item.dataset.id = r.id;
      item.innerHTML = `
        <div class="route-name">${r.name}</div>
        <div class="route-meta">
          <span class="primary">${formatDistance(r.distance)}</span>
          <span>${formatDuration(r.duration)}</span>
        </div>
      `;
      item.addEventListener('click', () => selectRoute(r.id));
      routesEl.appendChild(item);
    });

    selectRoute(routes[0].id);
  } catch (err) {
    console.error(err);
    routesEl.innerHTML = '<div class="placeholder">Ошибка при получении маршрутов</div>';
  }
}

function addRouteToMap(route) {
  const srcId = 'route-src-' + route.id;
  const layerId = 'route-lyr-' + route.id;

  if (map.getSource(srcId)) return;

  map.addSource(srcId, {
    type: 'geojson',
    data: { type: 'Feature', properties: {}, geometry: route.geometry },
  });

  map.addLayer({
    id: layerId,
    type: 'line',
    source: srcId,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: {
      'line-color': '#9ca3af',
      'line-width': 5,
      'line-opacity': 0.75,
    },
  });
}

function selectRoute(id) {
  state.activeRouteId = id;

  state.routes.forEach((r) => {
    const layerId = 'route-lyr-' + r.id;
    if (!map.getLayer(layerId)) return;

    const active = r.id === id;
    map.setPaintProperty(layerId, 'line-color', active ? '#3b82f6' : '#9ca3af');
    map.setPaintProperty(layerId, 'line-width', active ? 7 : 5);
    map.setPaintProperty(layerId, 'line-opacity', active ? 1 : 0.75);
  });

  document.querySelectorAll('.route-item').forEach((el) => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const route = state.routes.find((r) => r.id === id);
  if (route) {
    const coords = route.geometry.coordinates;
    const bounds = coords.reduce(
      (b, c) => b.extend(c),
      new maplibregl.LngLatBounds(coords[0], coords[0])
    );
    map.fitBounds(bounds, {
      padding: { top: 80, bottom: 80, left: 380, right: 80 },
      duration: 500,
    });
  }
}

function clearRoutes() {
  state.routes.forEach((r) => {
    const layerId = 'route-lyr-' + r.id;
    const srcId = 'route-src-' + r.id;
    if (map.getLayer(layerId)) map.removeLayer(layerId);
    if (map.getSource(srcId)) map.removeSource(srcId);
  });
  state.routes = [];
  state.activeRouteId = null;
  routesEl.innerHTML = '<div class="placeholder">Маршруты появятся здесь</div>';
}

/* ============================================================
 *  ФОРМАТИРОВАНИЕ
 * ============================================================ */

function formatDistance(m) {
  return m < 1000 ? `${m} м` : `${(m / 1000).toFixed(1)} км`;
}

function formatDuration(s) {
  const min = Math.round(s / 60);
  if (min < 60) return `${min} мин`;
  const h = Math.floor(min / 60);
  return `${h} ч ${min % 60} мин`;
}

/* ============================================================
 *  ОБРАБОТЧИКИ СОБЫТИЙ
 * ============================================================ */

let busy = false;

map.on('click', async (e) => {
  if (!state.selecting || busy) return;
  busy = true;
  try {
    await setPoint(state.selecting, e.lngLat.lng, e.lngLat.lat, null);
  } finally {
    busy = false;
  }
});

/* Ввод адресов (по Enter) */
async function handleAddressInput(which, input) {
  const q = input.value.trim();
  if (!q) return;
  if (busy) return;

  busy = true;
  try {
    hintEl.textContent = 'Поиск адреса…';
    const res = await api_geocodeAddress(q);
    await setPoint(which, res.lng, res.lat, res.label);
  } catch (err) {
    console.error(err);
    hintEl.textContent = 'Не удалось найти адрес';
  } finally {
    busy = false;
  }
}

inputA.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); handleAddressInput('A', inputA); }
});
inputB.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); handleAddressInput('B', inputB); }
});

/* Очистка точек */
function clearPoint(which) {
  if (markers[which]) { markers[which].remove(); markers[which] = null; }
  state[which] = null;
  (which === 'A' ? inputA : inputB).value = '';
  clearRoutes();
  setSelecting(which);
}

document.getElementById('clear-a').addEventListener('click', () => clearPoint('A'));
document.getElementById('clear-b').addEventListener('click', () => clearPoint('B'));

document.getElementById('reset-btn').addEventListener('click', () => {
  ['A', 'B'].forEach((w) => {
    if (markers[w]) { markers[w].remove(); markers[w] = null; }
    state[w] = null;
  });
  inputA.value = '';
  inputB.value = '';
  clearRoutes();
  setSelecting('A');
});

/* ============================================================
 *  СТАРТ
 * ============================================================ */

map.on('load', () => {
  setSelecting('A');
});
</script>
</body>
</html>
