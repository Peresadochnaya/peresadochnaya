<script src="assets/leaflet.js"></script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),summary=data.summary;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const km=m=>(m/1000).toLocaleString('ru-RU',{maximumFractionDigits:2})+' км';
const mins=s=>(s/60).toLocaleString('ru-RU',{maximumFractionDigits:1})+' мин';
document.getElementById('total-length').textContent=km(summary.length_meters);
document.getElementById('total-time').textContent=mins(summary.duration_seconds);
document.getElementById('metadata').textContent=`${summary.stop_count} остановок · ${summary.leg_count} отрезков · traffic_type=${summary.traffic_type} · ${summary.requested_at}`;
const legs=data.geojson.features.filter(f=>f.properties.kind==='car_leg');
const stops=data.geojson.features.filter(f=>f.properties.kind==='stop');
const first=legs[0].properties;
document.getElementById('focus').innerHTML=`<strong>Первый отрезок: ${first.from_stop_id} → ${first.to_stop_id}</strong><br>${esc(first.from_name)} → ${esc(first.to_name)}<br>По ответу: <strong>${km(first.length_meters)}</strong>, ${mins(first.duration_seconds)}. По прямой: <strong>${Math.round(first.straight_distance_meters)} м</strong>.<br>Причина объезда по одному ответу не установлена.`;
const map=L.map('map',{preferCanvas:true}).setView([59.934,30.334],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const group=L.featureGroup().addTo(map),legLayers=[];
for(const f of legs){const p=f.properties;const layer=L.geoJSON(f,{style:{color:p.leg_index===1?'#e87500':'#2563eb',weight:p.leg_index===1?7:4,opacity:p.leg_index===1?1:.67}}).bindTooltip(`${p.from_number} → ${p.to_number}: ${km(p.length_meters)}, ${mins(p.duration_seconds)}`).bindPopup(`<div class="popup-title">${p.from_number} → ${p.to_number}</div><div class="popup-details">${esc(p.from_name)} [${p.from_stop_id}]<br>→ ${esc(p.to_name)} [${p.to_stop_id}]<br><b>${km(p.length_meters)} · ${mins(p.duration_seconds)}</b><br>По прямой: ${Math.round(p.straight_distance_meters)} м<br>Статус: ${esc(p.status)}</div>`).addTo(group);legLayers.push(layer)}
const ref=data.geojson.features.find(f=>f.properties.kind==='straight_reference');
const direct=L.geoJSON(ref,{style:{color:'#a855f7',weight:3,dashArray:'7 6',opacity:.9}}).bindTooltip('Прямая 1 → 2, не маршрут').addTo(map);
const stopLayers=[];
for(const f of stops){const p=f.properties,[lon,lat]=f.geometry.coordinates;const marker=L.marker([lat,lon],{icon:L.divIcon({className:'',html:`<span class="stop-label ${p.number<3?'first':''}">${p.number}</span>`,iconSize:[25,25],iconAnchor:[12,12]}),zIndexOffset:p.number<3?1000:0}).bindTooltip(`${p.number}. ${p.name} [${p.id}]`).bindPopup(`<div class="popup-title">${p.number}. ${esc(p.name)}</div>ID ${esc(p.id)}<br>${lat}, ${lon}`).addTo(map);stopLayers.push(marker)}
const list=document.getElementById('legs');
for(const p of legs.map(f=>f.properties)){const button=document.createElement('button');button.innerHTML=`<div class="line-title">${p.from_number} → ${p.to_number} · ${esc(p.from_name)}</div><div class="line-meta">→ ${esc(p.to_name)} · ${km(p.length_meters)} · ${mins(p.duration_seconds)}</div>`;button.onclick=()=>{map.fitBounds(legLayers[p.leg_index-1].getBounds(),{padding:[45,45],maxZoom:16});legLayers[p.leg_index-1].openPopup();document.querySelectorAll('#legs button').forEach(b=>b.classList.remove('active'));button.classList.add('active')};list.appendChild(button)}
const all=document.getElementById('all'),firstButton=document.getElementById('first'),toggle=document.getElementById('only-first');
function visibility(){legLayers.forEach((l,i)=>{if(toggle.checked&&i!==0)group.removeLayer(l);else group.addLayer(l)});stopLayers.forEach((l,i)=>{if(toggle.checked&&i>1)map.removeLayer(l);else l.addTo(map)})}
all.onclick=()=>{toggle.checked=false;visibility();map.fitBounds(group.getBounds(),{padding:[35,35]});all.classList.add('active');firstButton.classList.remove('active')};
firstButton.onclick=()=>{map.fitBounds(legLayers[0].getBounds(),{padding:[45,45],maxZoom:16});legLayers[0].bringToFront();direct.bringToFront();firstButton.classList.add('active');all.classList.remove('active')};
toggle.onchange=()=>{visibility();if(toggle.checked)firstButton.click();else all.click()};
all.click();window.probeMap={map,legLayers,stopLayers,data};
</script>
